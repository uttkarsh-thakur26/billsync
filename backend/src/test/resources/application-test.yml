spring:
  datasource:
    url: jdbc:h2:mem:billsync;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    # Tests build the schema from the entity mappings, not from Flyway.
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false
